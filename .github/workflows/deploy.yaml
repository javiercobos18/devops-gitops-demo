name: Build and Deploy GitOps

on:
  push:
    branches:
      - main
    paths-ignore:
      - "gitops/mi-app/values.yaml"

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Node.js application
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ospeco/mi-app:${{ github.sha }}

      - name: Update Helm values
        run: |
          sed -i "s|^  tag:.*|  tag: \"${GITHUB_SHA}\"|" gitops/mi-app/values.yaml

      - name: Commit and push values.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/mi-app/values.yaml
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar"
          else
            git commit -m "chore: update image to ${GITHUB_SHA}"
            git push
          fi
